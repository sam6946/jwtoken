services:
  backend:
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      SECURE_SSL_REDIRECT: "true"
      SECURE_HSTS_SECONDS: "31536000"
      REFRESH_COOKIE_SECURE: "true"
    restart: always

  celery_worker:
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
    restart: always

  celery_beat:
    environment:
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
    restart: always

  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always
